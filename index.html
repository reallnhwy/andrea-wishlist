
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist</title>

<style>
:root {
  --bg: #faf8f2;
  --card: #fdfcf8;
  --tint: #efebdd;
  --green: #2c3a1f;
  --muted: #6b7560;
  --line: #d9d5c4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--green);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.5;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

header {
  padding: 48px 0 20px;
  border-bottom: 1.5px solid var(--green);
}

h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  margin: 0;
  letter-spacing: -0.5px;
}

header p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.filters {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 14px 0;
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid var(--line);
}

.chip {
  font: inherit;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 16px;
  border: 1px solid var(--green);
  background: transparent;
  color: var(--green);
  border-radius: 3px;
  cursor: pointer;
  transition: background .15s, color .15s;
}

.chip:hover { background: var(--tint); }
.chip.active {
  background: var(--green);
  color: var(--bg);
}

section { margin-top: 36px; }

section h2 {
  font-family: Georgia, serif;
  font-size: 1.5rem;
  margin: 0 0 4px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

section h2 small {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: normal;
  letter-spacing: 0.05em;
}

.rule {
  height: 1px;
  background: var(--line);
  margin: 8px 0 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
}

.card {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}

.card:hover, .card:focus-visible {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(44,58,31,.12);
  border-color: var(--green);
  outline: none;
}

.thumb {
  position: relative;
  aspect-ratio: 4 / 3;
  background: var(--tint);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.thumb .label {
  font-family: Georgia, serif;
  font-size: 1.6rem;
  color: var(--green);
  opacity: .55;
  text-align: center;
  padding: 0 10px;
}

.thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #fff;
  padding: 8px;
}

.body {
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.store {
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.name {
  font-family: Georgia, serif;
  font-size: 1.1rem;
  font-weight: bold;
  line-height: 1.25;
}

.note {
  font-size: 0.85rem;
  color: #4d5644;
  flex: 1;
}

.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}

.price { font-weight: 600; }

.go {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--green);
  color: var(--bg);
  padding: 7px 12px;
  border-radius: 3px;
}

.empty {
  color: var(--muted);
  padding: 30px 0;
}

footer {
  margin-top: 50px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 0.78rem;
  color: var(--muted);
}

@media (max-width: 520px) {
  .wrap { padding: 0 14px 40px; }
  header { padding-top: 32px; }
  .grid { grid-template-columns: 1fr; }
  .chip {
    flex: 1 1 auto;
    text-align: center;
    padding: 9px 10px;
  }
}
</style>
</head>

const tiers = [
  {
    id: "under",
    title: "Under $50",
    sub: "small treats",
    test: p => p < 50
  },
  {
    id: "around",
    title: "Around $100",
    sub: "$50 to $149",
    test: p => p >= 50 && p < 150
  },
  {
    id: "above",
    title: "Above $150",
    sub: "bigger purchases",
    test: p => p >= 150
  }
];

const fmt = p => "~$" + p.toLocaleString("en-CA");

let active = "all";

function cardHTML(it) {

  const card = document.createElement("a");
  card.className = "card";
  card.href = it.url;
  card.target = "_blank";
  card.rel = "noopener noreferrer";

  const thumb = document.createElement("div");
  thumb.className = "thumb";

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = it.cat;

  thumb.appendChild(label);

  if (it.img) {
    const img = document.createElement("img");
    img.src = it.img;
    img.alt = it.name;
    img.loading = "lazy";
    img.onerror = () => img.remove();
    thumb.appendChild(img);
  }

  const body = document.createElement("div");
  body.className = "body";

  const store = document.createElement("div");
  store.className = "store";
  store.textContent = it.store;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = it.name;

  const note = document.createElement("div");
  note.className = "note";
  note.textContent = it.note;

  const foot = document.createElement("div");
  foot.className = "foot";

  const price = document.createElement("span");
  price.className = "price";
  price.textContent = fmt(it.price);

  const go = document.createElement("span");
  go.className = "go";
  go.textContent = "View";

  foot.append(price, go);
  body.append(store, name, note, foot);
  card.append(thumb, body);

  return card;
}

function render() {

  const list = document.getElementById("list");
  list.replaceChildren();

  // Christmas filter shows only items marked christmas.
  if (active === "christmas") {

    const christmasItems = items
      .filter(i => i.wishlist === "christmas")
      .sort((a, b) => a.price - b.price);

    if (christmasItems.length) {
      const grid = document.createElement("div");
      grid.className = "grid";

      christmasItems.forEach(item => {
        grid.appendChild(cardHTML(item));
      });

      list.appendChild(grid);
    } else {
      list.innerHTML = '<p class="empty">No Christmas wishlist items yet.</p>';
    }

    return;
  }

  // All and price filters.
  tiers.forEach(t => {

    if (active !== "all" && active !== t.id) return;

    const group = items
      .filter(i => t.test(i.price))
      .sort((a, b) => a.price - b.price);

    if (!group.length) return;

    const section = document.createElement("section");

    const heading = document.createElement("h2");
    heading.textContent = t.title;

    const small = document.createElement("small");
    small.textContent =
      `${t.sub} · ${group.length} item${group.length > 1 ? "s" : ""}`;

    heading.appendChild(small);

    const rule = document.createElement("div");
    rule.className = "rule";

    const grid = document.createElement("div");
    grid.className = "grid";

    group.forEach(item => {
      grid.appendChild(cardHTML(item));
    });

    section.append(heading, rule, grid);
    list.appendChild(section);

  });

  if (!list.children.length) {
    list.innerHTML = '<p class="empty">Nothing in this range yet.</p>';
  }
}


function buildFilters() {

  const nav = document.getElementById("filters");

  const opts = [
    { id: "all", title: "All" },
    { id: "christmas", title: "🎄 Christmas" },
    ...tiers.map(t => ({
      id: t.id,
      title: t.title
    }))
  ];

  opts.forEach(option => {

    const button = document.createElement("button");

    button.className =
      "chip" + (option.id === active ? " active" : "");

    button.type = "button";
    button.textContent = option.title;

    button.addEventListener("click", () => {

      active = option.id;

      nav.querySelectorAll(".chip").forEach(chip => {
        chip.classList.toggle(
          "active",
          chip.textContent === option.title
        );
      });

      render();

    });

    nav.appendChild(button);

  });

}

buildFilters();
render();
